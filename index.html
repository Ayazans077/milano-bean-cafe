<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milano Bean Café</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* COLORS */
:root {
  --green: #071e12;
  --green-light: #0f2d1a;
  --gold: #c9a050;
  --cream: #f5f5f5;
}

/* BODY */
body {
  font-family: 'Inter', sans-serif;
  background: var(--green);
  color: white;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

.logo {
  font-weight: 600;
  color: var(--gold);
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  padding: 0 60px;
}

.hero h1 {
  font-size: 60px;
  font-family: 'Playfair Display', serif;
}

.hero p {
  margin-top: 15px;
  color: #ccc;
}

/* MENU SECTION */
.menu {
  padding: 100px 60px;
}

.menu h2 {
  font-size: 40px;
  margin-bottom: 30px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
}

/* MENU CARD */
.card {
  background: var(--green-light);
  padding: 20px;
  border-radius: 12px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card h3 {
  font-size: 18px;
}

.card p {
  font-size: 13px;
  color: #aaa;
}

.price {
  color: var(--gold);
  margin-top: 10px;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">Milano Bean Café</div>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Order</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>Luxury Coffee Experience</h1>
    <p>Crafted drinks, desserts, and premium café vibes.</p>
  </div>
</section>

<!-- MENU -->
<section class="menu">
  <h2>Our Menu</h2>

  <div class="menu-grid" id="menuGrid"></div>
</section>

<script>

// 🔥 YOUR REAL MENU DATA (SHORTENED FOR NOW)
const menuData = {
  "Hot Coffee": [
    { name: "Latte", desc: "Creamy espresso drink", price: "$4.50" },
    { name: "Cappuccino", desc: "Rich foam coffee", price: "$4.75" },
    { name: "Americano", desc: "Classic black coffee", price: "$3.50" }
  ],
  "Desserts": [
    { name: "Cheesecake", desc: "Creamy and rich", price: "$6.50" },
    { name: "Tiramisu", desc: "Italian classic", price: "$7.00" }
  ]
};

const grid = document.getElementById("menuGrid");

// CREATE TABS
const tabsContainer = document.createElement("div");
tabsContainer.style.marginBottom = "30px";
tabsContainer.style.display = "flex";
tabsContainer.style.gap = "10px";

document.querySelector(".menu").insertBefore(tabsContainer, grid);

// FUNCTION TO RENDER MENU
function renderMenu(category) {
  grid.innerHTML = "";

  menuData[category].forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${item.name}</h3>
      <p>${item.desc}</p>
      <div class="price">${item.price}</div>
    `;

    grid.appendChild(card);
  });
}

// CREATE TAB BUTTONS
Object.keys(menuData).forEach((cat, index) => {
  const btn = document.createElement("button");
  btn.textContent = cat;

  btn.style.padding = "10px 18px";
  btn.style.border = "none";
  btn.style.borderRadius = "20px";
  btn.style.cursor = "pointer";
  btn.style.background = index === 0 ? "#c9a050" : "#222";
  btn.style.color = index === 0 ? "#000" : "#fff";

  btn.onclick = () => {
    document.querySelectorAll("button").forEach(b => {
      b.style.background = "#222";
      b.style.color = "#fff";
    });

    btn.style.background = "#c9a050";
    btn.style.color = "#000";

    renderMenu(cat);
  };

  tabsContainer.appendChild(btn);
});

// LOAD FIRST CATEGORY
renderMenu(Object.keys(menuData)[0]);

</script>

</body>
</html>
